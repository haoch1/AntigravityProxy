<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 412" width="960" height="412" role="img" aria-label="Antigravity Proxy Launcher Architecture">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 1.5 L 8.5 5 L 1 8.5" fill="none" stroke="#64748B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 1.5 L 8.5 5 L 1 8.5" fill="none" stroke="#60A5FA" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    </style>
  </defs>

  <!-- Canvas -->
  <rect x="0.5" y="0.5" width="959" height="411" rx="14" fill="#0D1117" stroke="#30363D"/>

  <!-- Header -->
  <text x="28" y="34" class="mono" font-size="10.5" font-weight="600" fill="#8B949E" letter-spacing="1.2">ARCHITECTURE · PROCESS-SCOPED PROXY INJECTION</text>
  <text x="28" y="57" class="sans" font-size="15.5" font-weight="600" fill="#F0F6FC">执行流程：系统代理采集 → 环境变量规范化 → 子进程隔离注入</text>

  <!-- Step 01 -->
  <rect x="24" y="76" width="210" height="128" rx="10" fill="#161B22" stroke="#30363D"/>
  <rect x="40" y="92" width="28" height="20" rx="6" fill="#1E3A5F"/>
  <text x="54" y="106" text-anchor="middle" class="mono" font-size="11" font-weight="700" fill="#60A5FA">01</text>
  <text x="76" y="106" class="mono" font-size="10.5" fill="#8B949E">FindAntigravity</text>
  <text x="40" y="136" class="sans" font-size="13.5" font-weight="600" fill="#F0F6FC">定位可执行文件</text>
  <text x="40" y="160" class="sans" font-size="11.5" fill="#C9D1D9">优先检索默认安装目录</text>
  <text x="40" y="180" class="sans" font-size="11.5" fill="#8B949E">未命中时回退至注册表</text>

  <!-- Arrow 1 -> 2 -->
  <line x1="238" y1="140" x2="253" y2="140" stroke="#64748B" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- Step 02 -->
  <rect x="258" y="76" width="210" height="128" rx="10" fill="#161B22" stroke="#30363D"/>
  <rect x="274" y="92" width="28" height="20" rx="6" fill="#3B2B14"/>
  <text x="288" y="106" text-anchor="middle" class="mono" font-size="11" font-weight="700" fill="#FBBF24">02</text>
  <text x="310" y="106" class="mono" font-size="10.5" fill="#8B949E">SingleInstance</text>
  <text x="274" y="136" class="sans" font-size="13.5" font-weight="600" fill="#F0F6FC">单实例状态校验</text>
  <text x="274" y="160" class="sans" font-size="11.5" fill="#C9D1D9">检测 Chrome_MessageWindow</text>
  <text x="274" y="180" class="sans" font-size="11.5" fill="#8B949E">防止复用到未注入旧实例</text>

  <!-- Arrow 2 -> 3 -->
  <line x1="472" y1="140" x2="487" y2="140" stroke="#64748B" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- Step 03 -->
  <rect x="492" y="76" width="210" height="128" rx="10" fill="#161B22" stroke="#30363D"/>
  <rect x="508" y="92" width="28" height="20" rx="6" fill="#133322"/>
  <text x="522" y="106" text-anchor="middle" class="mono" font-size="11" font-weight="700" fill="#4ADE80">03</text>
  <text x="544" y="106" class="mono" font-size="10.5" fill="#8B949E">WinHttp API</text>
  <text x="508" y="136" class="sans" font-size="13.5" font-weight="600" fill="#F0F6FC">读取系统代理配置</text>
  <text x="508" y="160" class="sans" font-size="11.5" fill="#C9D1D9">解析手动代理与绕过规则</text>
  <text x="508" y="180" class="sans" font-size="11.5" fill="#8B949E">适配标准 WinINet 系统代理</text>

  <!-- Arrow 3 -> 4 -->
  <line x1="706" y1="140" x2="721" y2="140" stroke="#64748B" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- Step 04 -->
  <rect x="726" y="76" width="210" height="128" rx="10" fill="#161B22" stroke="#388BFD" stroke-width="1.3"/>
  <rect x="742" y="92" width="28" height="20" rx="6" fill="#1E3A5F"/>
  <text x="756" y="106" text-anchor="middle" class="mono" font-size="11" font-weight="700" fill="#93C5FD">04</text>
  <text x="778" y="106" class="mono" font-size="10.5" fill="#60A5FA">Process.Start</text>
  <text x="742" y="136" class="sans" font-size="13.5" font-weight="600" fill="#F0F6FC">隔离注入并启动</text>
  <text x="742" y="160" class="sans" font-size="11.5" fill="#C9D1D9">透传命令行参数派生子进程</text>
  <text x="742" y="180" class="sans" font-size="11.5" fill="#60A5FA" font-weight="500">启动器随即退出，无后台驻留</text>

  <!-- Flow connector from Step 04 to Bottom Cards -->
  <path d="M 831 204 L 831 221 L 298 221 L 298 235" fill="none" stroke="#60A5FA" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow-accent)"/>
  <line x1="831" y1="221" x2="831" y2="235" stroke="#60A5FA" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow-accent)"/>

  <!-- Bottom Left Card: Environment Variables -->
  <rect x="24" y="240" width="548" height="148" rx="10" fill="#161B22" stroke="#30363D"/>
  <text x="40" y="266" class="sans" font-size="13" font-weight="600" fill="#F0F6FC">子进程环境变量注入策略</text>
  <text x="556" y="266" text-anchor="end" class="mono" font-size="10.5" fill="#6E7681">ProcessStartInfo.Environment</text>
  <line x1="40" y1="277" x2="556" y2="277" stroke="#21262D" stroke-width="1"/>

  <!-- Env Row 1 -->
  <rect x="40" y="288" width="46" height="20" rx="5" fill="#133322"/>
  <text x="63" y="302" text-anchor="middle" class="mono" font-size="10" font-weight="700" fill="#4ADE80">SET</text>
  <text x="96" y="302" class="mono" font-size="11.5" font-weight="600" fill="#F0F6FC">HTTP_PROXY / HTTPS_PROXY</text>
  <text x="296" y="302" class="mono" font-size="11" fill="#8B949E">→ http://&lt;host&gt;:&lt;port&gt;</text>

  <!-- Env Row 2 -->
  <rect x="40" y="319" width="46" height="20" rx="5" fill="#1E3A5F"/>
  <text x="63" y="333" text-anchor="middle" class="mono" font-size="10" font-weight="700" fill="#60A5FA">NORM</text>
  <text x="96" y="333" class="mono" font-size="11.5" font-weight="600" fill="#F0F6FC">NO_PROXY</text>
  <text x="168" y="333" class="mono" font-size="10.5" fill="#8B949E">→ localhost,127.0.0.1,::1,[::1],0.0.0.0,.local,CIDR</text>

  <!-- Env Row 3 -->
  <rect x="40" y="350" width="46" height="20" rx="5" fill="#3D1A1D"/>
  <text x="63" y="364" text-anchor="middle" class="mono" font-size="10" font-weight="700" fill="#F87171">UNSET</text>
  <text x="96" y="364" class="mono" font-size="11.5" font-weight="600" fill="#F0F6FC">ALL_PROXY</text>
  <text x="174" y="364" class="sans" font-size="11.5" fill="#8B949E">→ 显式清除，防止本地 IPC / WebSocket 误经代理</text>

  <!-- Bottom Right Card: Scope Isolation -->
  <rect x="592" y="240" width="344" height="148" rx="10" fill="#161B22" stroke="#30363D"/>
  <text x="608" y="266" class="sans" font-size="13" font-weight="600" fill="#F0F6FC">代理作用域隔离</text>
  <line x1="608" y1="277" x2="920" y2="277" stroke="#21262D" stroke-width="1"/>

  <!-- Scope Row 1 -->
  <circle cx="614" cy="298" r="4" fill="#60A5FA"/>
  <text x="626" y="302" class="sans" font-size="12" font-weight="600" fill="#F0F6FC">Electron 渲染进程</text>
  <text x="920" y="302" text-anchor="end" class="sans" font-size="11.5" fill="#C9D1D9">遵循 Windows 系统代理</text>

  <!-- Scope Row 2 -->
  <circle cx="614" cy="329" r="4" fill="#4ADE80"/>
  <text x="626" y="333" class="sans" font-size="12" font-weight="600" fill="#F0F6FC">语言服务 / 后端</text>
  <text x="920" y="333" text-anchor="end" class="sans" font-size="11.5" fill="#C9D1D9">继承子进程注入环境变量</text>

  <!-- Scope Row 3 -->
  <circle cx="614" cy="360" r="4" fill="#6E7681"/>
  <text x="626" y="364" class="sans" font-size="12" font-weight="600" fill="#F0F6FC">系统全局环境</text>
  <text x="920" y="364" text-anchor="end" class="sans" font-size="11.5" fill="#8B949E">保持不变，零侵入性</text>
</svg>
