<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 412" width="960" height="412" role="img" aria-label="Antigravity Proxy Launcher Architecture">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 1.5 L 8.5 5 L 1 8.5" fill="none" stroke="#94A3B8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 1.5 L 8.5 5 L 1 8.5" fill="none" stroke="#2563EB" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <filter id="card-shadow" x="-4%" y="-6%" width="108%" height="116%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.05"/>
    </filter>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    </style>
  </defs>

  <!-- Canvas -->
  <rect x="0.5" y="0.5" width="959" height="411" rx="14" fill="#F8FAFC" stroke="#E2E8F0"/>

  <!-- Header -->
  <text x="28" y="34" class="mono" font-size="10.5" font-weight="600" fill="#64748B" letter-spacing="1.2">ARCHITECTURE · PROCESS-SCOPED PROXY INJECTION</text>
  <text x="28" y="57" class="sans" font-size="15.5" font-weight="600" fill="#0F172A">执行流程：系统代理采集 → 环境变量规范化 → 子进程隔离注入</text>

  <!-- Step 01 -->
  <g filter="url(#card-shadow)">
    <rect x="24" y="76" width="210" height="128" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/>
  </g>
  <rect x="40" y="92" width="28" height="20" rx="6" fill="#EFF6FF"/>
  <text x="54" y="106" text-anchor="middle" class="mono" font-size="11" font-weight="700" fill="#2563EB">01</text>
  <text x="76" y="106" class="mono" font-size="10.5" fill="#64748B">FindAntigravity</text>
  <text x="40" y="136" class="sans" font-size="13.5" font-weight="600" fill="#0F172A">定位可执行文件</text>
  <text x="40" y="160" class="sans" font-size="11.5" fill="#475569">优先检索默认安装目录</text>
  <text x="40" y="180" class="sans" font-size="11.5" fill="#64748B">未命中时回退至注册表</text>

  <!-- Arrow 1 -> 2 -->
  <line x1="238" y1="140" x2="253" y2="140" stroke="#94A3B8" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- Step 02 -->
  <g filter="url(#card-shadow)">
    <rect x="258" y="76" width="210" height="128" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/>
  </g>
  <rect x="274" y="92" width="28" height="20" rx="6" fill="#FFFBEB"/>
  <text x="288" y="106" text-anchor="middle" class="mono" font-size="11" font-weight="700" fill="#D97706">02</text>
  <text x="310" y="106" class="mono" font-size="10.5" fill="#64748B">SingleInstance</text>
  <text x="274" y="136" class="sans" font-size="13.5" font-weight="600" fill="#0F172A">单实例状态校验</text>
  <text x="274" y="160" class="sans" font-size="11.5" fill="#475569">检测 Chrome_MessageWindow</text>
  <text x="274" y="180" class="sans" font-size="11.5" fill="#64748B">防止复用到未注入旧实例</text>

  <!-- Arrow 2 -> 3 -->
  <line x1="472" y1="140" x2="487" y2="140" stroke="#94A3B8" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- Step 03 -->
  <g filter="url(#card-shadow)">
    <rect x="492" y="76" width="210" height="128" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/>
  </g>
  <rect x="508" y="92" width="28" height="20" rx="6" fill="#F0FDF4"/>
  <text x="522" y="106" text-anchor="middle" class="mono" font-size="11" font-weight="700" fill="#16A34A">03</text>
  <text x="544" y="106" class="mono" font-size="10.5" fill="#64748B">WinHttp API</text>
  <text x="508" y="136" class="sans" font-size="13.5" font-weight="600" fill="#0F172A">读取系统代理配置</text>
  <text x="508" y="160" class="sans" font-size="11.5" fill="#475569">解析手动代理与绕过规则</text>
  <text x="508" y="180" class="sans" font-size="11.5" fill="#64748B">适配标准 WinINet 系统代理</text>

  <!-- Arrow 3 -> 4 -->
  <line x1="706" y1="140" x2="721" y2="140" stroke="#94A3B8" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- Step 04 -->
  <g filter="url(#card-shadow)">
    <rect x="726" y="76" width="210" height="128" rx="10" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="1.3"/>
  </g>
  <rect x="742" y="92" width="28" height="20" rx="6" fill="#DBEAFE"/>
  <text x="756" y="106" text-anchor="middle" class="mono" font-size="11" font-weight="700" fill="#1D4ED8">04</text>
  <text x="778" y="106" class="mono" font-size="10.5" fill="#2563EB">Process.Start</text>
  <text x="742" y="136" class="sans" font-size="13.5" font-weight="600" fill="#0F172A">隔离注入并启动</text>
  <text x="742" y="160" class="sans" font-size="11.5" fill="#475569">透传命令行参数派生子进程</text>
  <text x="742" y="180" class="sans" font-size="11.5" fill="#2563EB" font-weight="500">启动器随即退出，无后台驻留</text>

  <!-- Flow connector from Step 04 to Bottom Cards -->
  <path d="M 831 204 L 831 221 L 298 221 L 298 235" fill="none" stroke="#2563EB" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow-accent)"/>
  <line x1="831" y1="221" x2="831" y2="235" stroke="#2563EB" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow-accent)"/>

  <!-- Bottom Left Card: Environment Variables -->
  <g filter="url(#card-shadow)">
    <rect x="24" y="240" width="548" height="148" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/>
  </g>
  <text x="40" y="266" class="sans" font-size="13" font-weight="600" fill="#0F172A">子进程环境变量注入策略</text>
  <text x="556" y="266" text-anchor="end" class="mono" font-size="10.5" fill="#94A3B8">ProcessStartInfo.Environment</text>
  <line x1="40" y1="277" x2="556" y2="277" stroke="#F1F5F9" stroke-width="1"/>

  <!-- Env Row 1 -->
  <rect x="40" y="288" width="46" height="20" rx="5" fill="#DCFCE7"/>
  <text x="63" y="302" text-anchor="middle" class="mono" font-size="10" font-weight="700" fill="#15803D">SET</text>
  <text x="96" y="302" class="mono" font-size="11.5" font-weight="600" fill="#0F172A">HTTP_PROXY / HTTPS_PROXY</text>
  <text x="296" y="302" class="mono" font-size="11" fill="#475569">→ http://&lt;host&gt;:&lt;port&gt;</text>

  <!-- Env Row 2 -->
  <rect x="40" y="319" width="46" height="20" rx="5" fill="#DBEAFE"/>
  <text x="63" y="333" text-anchor="middle" class="mono" font-size="10" font-weight="700" fill="#1D4ED8">NORM</text>
  <text x="96" y="333" class="mono" font-size="11.5" font-weight="600" fill="#0F172A">NO_PROXY</text>
  <text x="168" y="333" class="mono" font-size="10.5" fill="#475569">→ localhost,127.0.0.1,::1,[::1],0.0.0.0,.local,CIDR</text>

  <!-- Env Row 3 -->
  <rect x="40" y="350" width="46" height="20" rx="5" fill="#FEE2E2"/>
  <text x="63" y="364" text-anchor="middle" class="mono" font-size="10" font-weight="700" fill="#B91C1C">UNSET</text>
  <text x="96" y="364" class="mono" font-size="11.5" font-weight="600" fill="#0F172A">ALL_PROXY</text>
  <text x="174" y="364" class="sans" font-size="11.5" fill="#64748B">→ 显式清除，防止本地 IPC / WebSocket 误经代理</text>

  <!-- Bottom Right Card: Scope Isolation -->
  <g filter="url(#card-shadow)">
    <rect x="592" y="240" width="344" height="148" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/>
  </g>
  <text x="608" y="266" class="sans" font-size="13" font-weight="600" fill="#0F172A">代理作用域隔离</text>
  <line x1="608" y1="277" x2="920" y2="277" stroke="#F1F5F9" stroke-width="1"/>

  <!-- Scope Row 1 -->
  <circle cx="614" cy="298" r="4" fill="#2563EB"/>
  <text x="626" y="302" class="sans" font-size="12" font-weight="600" fill="#0F172A">Electron 渲染进程</text>
  <text x="920" y="302" text-anchor="end" class="sans" font-size="11.5" fill="#475569">遵循 Windows 系统代理</text>

  <!-- Scope Row 2 -->
  <circle cx="614" cy="329" r="4" fill="#16A34A"/>
  <text x="626" y="333" class="sans" font-size="12" font-weight="600" fill="#0F172A">语言服务 / 后端</text>
  <text x="920" y="333" text-anchor="end" class="sans" font-size="11.5" fill="#475569">继承子进程注入环境变量</text>

  <!-- Scope Row 3 -->
  <circle cx="614" cy="360" r="4" fill="#94A3B8"/>
  <text x="626" y="364" class="sans" font-size="12" font-weight="600" fill="#0F172A">系统全局环境</text>
  <text x="920" y="364" text-anchor="end" class="sans" font-size="11.5" fill="#64748B">保持不变，零侵入性</text>
</svg>
